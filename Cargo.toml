[package]
name = "pithdb"
version = "0.0.1"
edition = "2021"
description = "Pith: lightweight embeddable vector database with built-in ONNX embeddings (name reservation, work in progress)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["vector-database", "embeddings", "onnx", "search"]
categories = ["database-implementations"]

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.11"
thiserror = "2.0.21"
zstd = "0.14.3"

[[bin]]
name = "pith"
path = "src/main.rs"

[features]
default = ["onnx", "mcp"]
# Heavy deps (ort, tokenizers / rmcp, tokio) become optional members of these in later tasks.
onnx = []
mcp = []

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
